# `cooldown` keeps freshly published (possibly compromised) versions out for 14
# days. Dependabot PRs get no repo secrets, so the AI review skips them.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    cooldown:
      default-days: 14
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Dependabot bumps single pins; `pip check` in CI fails a bump that leaves
  # another package unsatisfied.
  - package-ecosystem: pip
    directory: /function_app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    cooldown:
      default-days: 14
    groups:
      function-app-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    cooldown:
      default-days: 14
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /tfl_status_agent
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    cooldown:
      default-days: 14
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
