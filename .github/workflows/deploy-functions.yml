name: Deploy functions

# Manual only. Publishes the MCP Function App (func-tfl-mcp) from a commit that
# is on main; nothing here runs on a merge or a schedule.
# Run it from the Actions tab or: gh workflow run deploy-functions.yml --ref main
# Rollback is the same button with an older commit SHA.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA to deploy (empty = the head of main)
        required: false
        default: ""

# One deploy at a time; a second click waits instead of racing the first.
concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      # The scripts always come from this checkout (the head of main). The
      # commit being deployed is only read, via `git archive`, so deploying a
      # commit that predates these scripts still works.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # The history is fetched here; later steps only read it locally, so
          # keep the job's git token off disk while the Azure session is open.
          persist-credentials: false

      # Everything that can be checked without Azure is checked before logging in.
      - name: Resolve and validate the commit
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha="$(./scripts/resolve-deploy-sha.sh "$INPUT_SHA")"
          echo "SHA=$sha" >> "$GITHUB_ENV"

      - name: Extract that commit's sources
        run: |
          mkdir "$RUNNER_TEMP/src"
          git archive "$SHA" | tar -x -C "$RUNNER_TEMP/src"

      - name: Build the package
        run: ./scripts/package-functions.sh "$RUNNER_TEMP/src" "$RUNNER_TEMP/functions.zip"

      # OIDC login with the Azure CLI (the repo only allows a short list of
      # third-party actions, so azure/login is not used).
      - name: Log in to Azure
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
        run: ./scripts/ci-azure-login.sh "$CLIENT_ID"

      - name: Deploy and check the functions
        run: |
          set -o pipefail
          ./scripts/deploy-functions.sh "$RUNNER_TEMP/functions.zip" | tee "$RUNNER_TEMP/deploy.log"

      - name: Summary
        run: |
          {
            echo "### Deployed \`$SHA\` to func-tfl-mcp"
            echo
            git log -1 --format=%s "$SHA"
            echo
            grep '^function: ' "$RUNNER_TEMP/deploy.log" | sed 's/^function: /- /'
          } >> "$GITHUB_STEP_SUMMARY"
