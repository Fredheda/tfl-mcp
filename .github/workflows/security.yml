name: Security

# Pull requests and a weekly run; a merge to main starts nothing. gitleaks and
# workflow-lint run on every push to a PR, draft or not. The other scans run
# when the PR is marked ready, on the weekly schedule and on demand
# (`gh workflow run security.yml --ref main`); those two also scan the full
# history, and workflow-lint is PR-only. The ruleset on main requires gitleaks, bandit and
# workflow-lint; pip-audit and codeql are advisory.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # Advisories appear without any code change, so the dependency audits also
  # run weekly.
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

# A new push to the same PR cancels the run that is still going. Scheduled
# runs are never cancelled.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Blocks the PR. Runs the pinned gitleaks image directly: the gitleaks
  # action needs a license key for organization repos.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # PRs scan only the commits they add; the weekly run scans the whole
      # history.
      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          log_opts=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            log_opts=(--log-opts="${BASE_SHA}..${HEAD_SHA}")
          fi
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --verbose "${log_opts[@]}"

  # Blocks the PR. Lints the workflow files with the pinned actionlint image.
  workflow-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint workflows
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color

  # Advisory on PRs (a new advisory against an old dependency must not fail an
  # unrelated PR); the weekly run fails visibly.
  pip-audit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Poetry
        run: pipx install poetry==2.5.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: poetry
      - run: poetry install --no-interaction
      - run: poetry run pip install pip-audit==2.10.1
      - name: Audit Poetry environment
        run: poetry run pip-audit --local
      # function_app/ has its own dependencies; audit them in their own venv,
      # never in the Poetry environment.
      - name: Audit function_app requirements
        # pipx defaults to the runner's system Python (3.12), which cannot
        # resolve packages that need 3.13 (azure-functions 2.x); run it on the
        # interpreter setup-python installed.
        run: pipx run --python "$(which python)" pip-audit==2.10.1 -r function_app/requirements.txt

  # HIGH severity only: bandit's lower levels are mostly noise for this code.
  bandit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      # Same interpreter as the code under scan (3.13), not pipx's default.
      - run: pipx run --python "$(which python)" bandit==1.9.4 -r . -lll -x ./tests,./function_app/tests,./.venv,./function_app/.venv

  # Findings appear in the repo's Security tab, not as a failing check.
  codeql:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:python
