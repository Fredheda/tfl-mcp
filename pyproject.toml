[project]
name = "tfl-mcp"
version = "0.1.0"
description = "TFL line status MCP server."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp[cli]>=2.1.1,<3.0.0",
    "pandas>=2.3.2",
    "requests>=2.32.5",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
