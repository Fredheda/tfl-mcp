[project]
name = "tfl-mcp"
version = "0.1.0"
description = "TFL line status MCP server."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp[cli]>=1.14.0,<2.0.0",
    "pandas>=2.3.2",
    "requests>=2.32.5",
    "a2a-sdk[fastapi] (==1.1.2)",
    "fastapi (==0.139.0)",
    "uvicorn (==0.50.0)",
    "langchain (==1.2.10)",
    "langchain-openai (==1.3.3)",
    "langgraph (==1.0.10)",
    "python-dotenv (==1.2.2)",
    "langchain-mcp-adapters (>=0.3.2,<0.4.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"
python-dotenv = "1.2.2"
langchain-mcp-adapters = ">=0.3.2,<0.4.0"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
